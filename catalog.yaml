# The Trilio agent plugin catalog. One entry per SKU plugin, pinned to a
# released tag (and the commit it pointed at when pinned).
#
# Edit this file, then run:  python .pluginkit/pluginkit.py catalog .
# To bump an entry:          python .pluginkit/pluginkit.py pin . <name> <name>/v<version>
name: trilio
displayName: Trilio
description: Trilio agent plugins for every SKU. Add once, install any plugin.
owner:
  name: Trilio Platform Group
  email: platform@trilio.io

plugins:
  - name: site-recovery-kubernetes
    description: Check DR readiness and plan failovers with Trilio Site Recovery (TSR) for Kubernetes.
    repo: somesh22123/site-recovery-kubernetes
    path: plugins/site-recovery-kubernetes
    ref: site-recovery-kubernetes/v0.1.0
    sha: f878dc4fe59b61153973b915ff4a5d599707074c
    category: Developer Tools
